name: Publish to npm

on:
  # Manual runs validate installation, build and packing without publishing.
  workflow_dispatch:
    inputs:
      verify_version:
        description: Existing version to verify without publishing (leave empty for a build check)
        type: string
        required: false
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  publish:
    if: github.event_name == 'push' || inputs.verify_version == ''
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    env:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      PUPPETEER_SKIP_DOWNLOAD: 'true'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org/'
          package-manager-cache: false
      - name: Install npm with trusted publishing support
        run: npm install --global npm@11.17.0 --ignore-scripts --no-audit --no-fund
      - name: Check release tag
        if: github.event_name == 'push'
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          const { name, version } = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          if (name !== 'qualix' || !/^\d+\.\d+\.\d+$/.test(version) || process.env.GITHUB_REF_NAME !== `v${version}`) {
            throw new Error('Release tag must be v<package.json version>, using a stable qualix version.');
          }
          JS
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - name: Check package contents
        run: npm pack --dry-run
      - name: Publish using OIDC
        if: github.event_name == 'push'
        run: npm publish --access public --tag latest --registry=https://registry.npmjs.org/
  verify:
    needs: publish
    if: always() && ((github.event_name == 'push' && needs.publish.result == 'success') || (github.event_name == 'workflow_dispatch' && inputs.verify_version != ''))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      RELEASE_VERSION: ${{ inputs.verify_version || github.ref_name }}
    steps:
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org/'
          package-manager-cache: false
      - name: Verify version and latest on the official registry
        run: |
          VERSION=${RELEASE_VERSION#v}
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo 'Invalid release version' >&2; exit 1; }
          # npm can process new packages for several minutes after accepting a publish.
          for attempt in $(seq 1 60); do
            PUBLISHED=$(npm view "qualix@$VERSION" version --registry=https://registry.npmjs.org/ --cache="$RUNNER_TEMP/npm-verify-$attempt" --prefer-online) || PUBLISHED=''
            LATEST=$(npm view qualix dist-tags.latest --registry=https://registry.npmjs.org/ --cache="$RUNNER_TEMP/npm-verify-$attempt" --prefer-online) || LATEST=''
            if [ "$PUBLISHED" = "$VERSION" ] && [ "$LATEST" = "$VERSION" ] && npm pack "qualix@$VERSION" --registry=https://registry.npmjs.org/ --cache="$RUNNER_TEMP/npm-verify-$attempt" --prefer-online --pack-destination="$RUNNER_TEMP" --json > /dev/null; then
              echo "Verified qualix@$VERSION and latest=$LATEST"
              exit 0
            fi
            echo "Attempt $attempt: version=$PUBLISHED latest=$LATEST; waiting for npm processing"
            sleep 10
          done
          echo 'Official registry verification failed.' >&2
          exit 1
